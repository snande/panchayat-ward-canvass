<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>पंचायत वार्ड कैनवास</title>
  <!-- Installable shell: sw.js precaches this page, the manifest, icons, CSS, JS,
       the Hindi string table and the self-hosted font on install.
       Visible text is filled from src/strings.hi.json by js/app.js. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/noto-sans-devanagari-subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header>
    <h1 data-i18n="app_title"></h1>
    <p data-i18n="app_subtitle"></p>
  </header>
  <main id="app">
    <section class="empty-state" aria-labelledby="empty-title">
      <h2 id="empty-title" data-i18n="empty_title"></h2>
      <p data-i18n="empty_body"></p>
      <button type="button" class="btn-primary" id="primary-action" data-i18n="primary_action"></button>
    </section>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
