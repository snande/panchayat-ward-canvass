<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- theme-color must equal the --color-primary token in styles.css (repo-ci checks it). -->
  <meta name="theme-color" content="#0f766e">
  <title data-i18n="app_title">पंचायत वार्ड कैनवास</title>
  <!-- Installable shell: sw.js precaches this page, the manifest, icons, CSS, JS,
       the Hindi string table and the self-hosted font on install.
       Every data-i18n element holds its string from src/strings.hi.json as a
       no-JS fallback; js/app.js re-applies the table at startup and repo-ci
       fails if the two ever differ. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/noto-sans-devanagari-subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1 data-i18n="app_title">पंचायत वार्ड कैनवास</h1>
    <p data-i18n="app_subtitle">मतदाता सूची और घर-घर संपर्क</p>
  </header>
  <!-- The seat header (src/ui/seatHeader.js): pending, with no text, until
       js/app.js reads the stored seat; js/picker.js names each new seat. -->
  <div id="seat-header" class="seat-header" data-state="pending" aria-live="polite"></div>
  <main id="app">
    <!-- Team join (candidate code + team passphrase), shown by js/picker.js
         while the device holds no team credentials (src/ui/teamJoinScreen.js). -->
    <section id="team-join" class="picker" hidden></section>
    <section class="empty-state" aria-labelledby="empty-title">
      <h2 id="empty-title" data-i18n="empty_title">मतदाता सूची अभी लोड नहीं हुई है</h2>
      <p data-i18n="empty_body">शुरू करने के लिए अपने वार्ड की मतदाता सूची लोड करें। एक बार लोड होने के बाद यह ऐप बिना इंटरनेट के भी चलेगा।</p>
      <button type="button" class="btn-primary" id="primary-action" data-i18n="primary_action" hidden>वार्ड सूची लोड करें</button>
    </section>
    <section id="ward-picker" class="picker">
      <p class="notice" data-tone="info" data-i18n="picker_loading">वार्ड सूची लोड हो रही है…</p>
    </section>
    <!-- The ward-roll screen, the frame's default (src/ui/wardRollScreen.js):
         pick-a-ward notice, progress bar and loading line, Hindi error with
         whom to call and retry, or the virtualised voter list under its name
         search box (src/roll/rollFlow.js, src/ui/rollSearch.js, src/ui/rollList.js). -->
    <section id="roll" class="roll-section" aria-live="polite" hidden></section>
    <!-- Search over every loaded ward (src/ui/voterSearchScreen.js), from the nav bar. -->
    <section id="voter-search" class="roll-section search-section" hidden></section>
    <!-- One voter's card at #/voter/<ward>/<serial> (src/ui/voterRoute.js,
         started by js/app.js): loading, empty, error or the card, with a back
         button. While it shows, #app has data-route="voter" and the other
         screens are hidden. -->
    <section id="voter-route" class="roll-section voter-route-section" hidden></section>
    <p id="status" class="notice status" aria-live="polite"></p>
    <button type="button" class="btn-secondary status-retry" id="status-retry" data-i18n="roll_retry" hidden>फिर से कोशिश करें</button>
  </main>
  <!-- The SEC disclaimer footer below every screen: data source, not an
       official SEC app, the printed roll prevails (src/ui/secFooter.js,
       rendered by js/app.js; static text, so it shows offline). -->
  <footer id="sec-footer" class="sec-footer"></footer>
  <!-- The navigation frame (src/ui/appFrame.js): header slot #seat-header,
       main region #app, footer slot #sec-footer and this bottom navigation
       bar, one entry per screen. The entries are here so the bar shows before
       the modules load; js/picker.js renders them again, wired. -->
  <nav id="nav-bar" class="nav-bar" aria-label="मुख्य मेनू">
    <div class="nav-bar-items">
      <button type="button" class="nav-item" data-screen="roll" aria-current="page" data-i18n="nav_roll">मतदाता सूची</button>
      <button type="button" class="nav-item" data-screen="search" data-i18n="nav_search">खोजें</button>
      <button type="button" class="nav-item" data-screen="calls" data-i18n="nav_calls">कॉल सूची</button>
      <button type="button" class="nav-item" data-screen="turnout" data-i18n="nav_turnout">मतदान दिवस</button>
      <button type="button" class="nav-item" data-screen="sms" data-i18n="nav_sms">एसएमएस गिनती</button>
    </div>
  </nav>
  <script src="js/app.js"></script>
  <script type="module" src="js/picker.js"></script>
</body>
</html>
