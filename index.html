<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- theme-color must equal the --color-primary token in styles.css (repo-ci checks it). -->
  <meta name="theme-color" content="#0f766e">
  <title data-i18n="app_title">पंचायत वार्ड कैनवास</title>
  <!-- Installable shell: sw.js precaches this page, the manifest, icons, CSS, JS,
       the Hindi string table and the self-hosted font on install.
       Every data-i18n element holds its string from src/strings.hi.json as a
       no-JS fallback; js/app.js re-applies the table at startup and repo-ci
       fails if the two ever differ. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/noto-sans-devanagari-subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1 data-i18n="app_title">पंचायत वार्ड कैनवास</h1>
    <p data-i18n="app_subtitle">मतदाता सूची और घर-घर संपर्क</p>
  </header>
  <!-- The seat header: the loaded panchayat and ward, above every screen
       (src/ui/seatHeader.js; js/app.js restores it, js/picker.js updates it). -->
  <div id="seat-header" class="seat-header" aria-live="polite">
    <a class="seat-header-link" href="#ward-picker" data-i18n="seat_header_empty">कोई वार्ड लोड नहीं — ऊपर पंचायत और वार्ड चुनें</a>
  </div>
  <main id="app">
    <!-- Team join (candidate code + team passphrase), shown by js/picker.js
         while the device holds no team credentials (src/ui/teamJoinScreen.js). -->
    <section id="team-join" class="picker" hidden></section>
    <section class="empty-state" aria-labelledby="empty-title">
      <h2 id="empty-title" data-i18n="empty_title">मतदाता सूची अभी लोड नहीं हुई है</h2>
      <p data-i18n="empty_body">शुरू करने के लिए अपने वार्ड की मतदाता सूची लोड करें। एक बार लोड होने के बाद यह ऐप बिना इंटरनेट के भी चलेगा।</p>
      <button type="button" class="btn-primary" id="primary-action" data-i18n="primary_action" hidden>वार्ड सूची लोड करें</button>
    </section>
    <section id="ward-picker" class="picker">
      <p class="notice" data-tone="info" data-i18n="picker_loading">वार्ड सूची लोड हो रही है…</p>
    </section>
    <!-- The picked ward's roll: loading line, Hindi error with retry, or the
         virtualised voter list under its name search box (src/roll/rollFlow.js,
         src/ui/rollSearch.js, src/ui/rollList.js). -->
    <section id="roll" class="roll-section" aria-live="polite" hidden></section>
    <p id="status" class="notice status" aria-live="polite"></p>
    <button type="button" class="btn-secondary status-retry" id="status-retry" data-i18n="roll_retry" hidden>फिर से कोशिश करें</button>
  </main>
  <script src="js/app.js"></script>
  <script type="module" src="js/picker.js"></script>
</body>
</html>
