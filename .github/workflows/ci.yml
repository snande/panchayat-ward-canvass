name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node scripts/benchmark.mjs
      - run: git diff --exit-code reports/badli-ward1-benchmark.md
      - run: python3 scripts/check_pwa_shell.py
      - run: python3 -m unittest test_pwa_shell
        working-directory: scripts
