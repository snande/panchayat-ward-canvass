name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      # the expected entries src/decoder/secFixtures.test.js holds decodeRoll
      # to come from the reference decoder; committed copies must match them
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf fonttools
      - run: python decode.py --expected ../../src/decoder/master-glyph-table.json ../../fixtures/sec/expected-fixtures.json
        working-directory: tools/reference-decoder
      - run: git diff --exit-code -- fixtures/sec/
      - run: npm test
      - run: node scripts/benchmark.mjs
      # the committed report must exist and match what the decoder produces now
      - run: git ls-files --error-unmatch reports/badli-ward1-benchmark.md
      - run: test -z "$(git status --porcelain -- reports/)" || { git status --porcelain -- reports/; git diff -- reports/; exit 1; }
      - run: python3 scripts/check_pwa_shell.py
      - run: python3 -m unittest test_pwa_shell
        working-directory: scripts
