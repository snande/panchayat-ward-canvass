name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The npm install fallback covers package-lock.json not listing puppeteer
      # yet (it was added without network access); drop it once the
      # regenerated lockfile is committed. This job needs no browser.
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm test
      - run: node scripts/benchmark.mjs
      # the committed report must exist and match what the decoder produces now
      - run: git ls-files --error-unmatch reports/badli-ward1-benchmark.md
      - run: test -z "$(git status --porcelain -- reports/)" || { git status --porcelain -- reports/; git diff -- reports/; exit 1; }
      - run: python3 scripts/check_pwa_shell.py
      - run: python3 -m unittest test_pwa_shell
        working-directory: scripts
      # the statewide catalogue builder, offline, against fixtures/sec/catalogue-input
      - run: python3 -m unittest discover -s tools/sec-catalogue -p 'test_*.py'
