name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node scripts/benchmark.mjs
      # the committed report must exist and match what the decoder produces now
      - run: git ls-files --error-unmatch reports/badli-ward1-benchmark.md
      - run: test -z "$(git status --porcelain -- reports/)" || { git status --porcelain -- reports/; git diff -- reports/; exit 1; }
      - run: python3 scripts/check_pwa_shell.py
      - run: python3 -m unittest test_pwa_shell
        working-directory: scripts
      # the committed catalogue shards must be what the generator writes from
      # the saved portal responses (--input never touches catalogue.json), and
      # a second run must write the same bytes
      - run: python3 tools/sec-catalogue/build_catalogue.py --input fixtures/sec/portal-responses --out data/sec/catalogue
      - run: test -z "$(git status --porcelain -- data/sec/catalogue/)" || { git status --porcelain -- data/sec/catalogue/; git diff -- data/sec/catalogue/; exit 1; }
      - run: python3 tools/sec-catalogue/build_catalogue.py --input fixtures/sec/portal-responses --out "$RUNNER_TEMP/catalogue" && diff -r data/sec/catalogue "$RUNNER_TEMP/catalogue"
      # failures on invalid input, the urban-ward count, sorting, schemaVersion, no network
      - run: python3 -m unittest test_build_catalogue
        working-directory: scripts
