name: Deploy

# Publishes the shell and the /roll relay (functions/roll.js) to Cloudflare
# Pages. A static-only host has no /roll, so every roll download fails with
# the Hindi retry message; the smoke steps fail the run if that happens.
#
# Repo settings: secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
# variables CF_PAGES_PROJECT (the Pages project name) and SITE_DOMAIN (the
# live domain, e.g. canvass.takshavid.com).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # CI runs the same tests on this push; repeated here so a deploy
      # triggered by workflow_dispatch is gated too.
      - run: npm test
      - name: Check deploy configuration
        id: config
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CF_PAGES_PROJECT" ] || [ -z "$SITE_DOMAIN" ]; then
            echo "::warning::Cloudflare secrets, CF_PAGES_PROJECT or SITE_DOMAIN not set; skipping deploy. /roll stays unserved until they are."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage the static site
        if: steps.config.outputs.ready == 'true'
        # Fails if a sw.js precache path is not staged.
        run: node scripts/stage-site.mjs dist
      - name: Deploy to Cloudflare Pages
        if: steps.config.outputs.ready == 'true'
        # functions/ comes from the working directory; _routes.json from dist.
        run: npx --yes wrangler@3 pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch main
      - name: Smoke test the live domain
        if: steps.config.outputs.ready == 'true'
        run: |
          domain="$SITE_DOMAIN"
          base="https://$domain"
          ward_url="$(node -e '
            const c = JSON.parse(require("fs").readFileSync("config/constituency.json", "utf8"));
            for (const d of c.districts) for (const s of d.samitis) for (const p of s.panchayats)
              for (const w of p.wards) if (w.pdfUrl) { console.log(w.pdfUrl); process.exit(0); }
            process.exit(1);
          ')"

          # 1. The relay answers /roll and refuses a URL outside the config.
          ok=false
          for attempt in 1 2 3 4 5 6; do
            headers="$(curl -s -D - -o /dev/null "$base/roll?url=https://example.com/x.pdf" || true)"
            if echo "$headers" | head -n1 | grep -q ' 403' && echo "$headers" | grep -qi '^x-roll-relay:'; then ok=true; break; fi
            sleep 10
          done
          if [ "$ok" != true ]; then
            echo "::error::/roll on $domain did not answer 403 from the relay:"; echo "$headers"; exit 1
          fi

          # 2. _routes.json is in effect: static files are not intercepted.
          for path in / /sw.js; do
            headers="$(curl -s -D - -o /dev/null "$base$path")"
            if ! echo "$headers" | head -n1 | grep -q ' 200' || echo "$headers" | grep -qi '^x-roll-relay:'; then
              echo "::error::$path on $domain is not a plain static 200:"; echo "$headers"; exit 1
            fi
          done

          # 3. A real ward roll downloads through the relay as a PDF.
          headers="$(curl -s -D - -o /tmp/roll.pdf --max-time 60 -G "$base/roll" --data-urlencode "url=$ward_url")"
          if ! echo "$headers" | head -n1 | grep -q ' 200' \
            || ! echo "$headers" | grep -qi '^content-type: application/pdf' \
            || [ "$(head -c 5 /tmp/roll.pdf)" != "%PDF-" ]; then
            echo "::error::an allowed ward roll did not download as a PDF through $base/roll:"; echo "$headers"; exit 1
          fi
          echo "live domain $domain serves the shell and relays ward rolls"
