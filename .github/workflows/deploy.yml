name: Deploy

# Publishes the shell and the /roll relay (functions/roll.js) to Cloudflare
# Pages. A static-only host has no /roll, so every roll download fails with
# the Hindi retry message; the smoke step fails the run if that happens.
#
# Repo settings: secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
# variable CF_PAGES_PROJECT (the Pages project name).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Check deploy configuration
        id: config
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CF_PAGES_PROJECT" ]; then
            echo "::warning::Cloudflare secrets or CF_PAGES_PROJECT not set; skipping deploy. /roll stays unserved until they are."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage the static site
        if: steps.config.outputs.ready == 'true'
        # Only the shell is published as static files; fixtures, tests and
        # tooling stay out. functions/ is picked up from the repo root.
        run: |
          mkdir dist
          cp -r _routes.json CNAME index.html manifest.webmanifest styles.css sw.js \
            config fonts icons js relay src dist/
      - name: Deploy to Cloudflare Pages
        if: steps.config.outputs.ready == 'true'
        run: npx --yes wrangler@3 pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch main
      - name: Smoke test /roll on the live domain
        if: steps.config.outputs.ready == 'true'
        run: |
          domain="$(tr -d '[:space:]' < CNAME)"
          for attempt in 1 2 3 4 5 6; do
            headers="$(curl -s -D - -o /dev/null "https://$domain/roll?url=https://example.com/x.pdf" || true)"
            if echo "$headers" | head -n1 | grep -q ' 403' && echo "$headers" | grep -qi '^x-roll-relay:'; then
              echo "/roll is served by the relay on $domain"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/roll on $domain did not answer 403 from the relay:"
          echo "$headers"
          exit 1
